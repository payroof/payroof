[package]
name = "payroof"
description = "Watch-only cryptocurrency payment references, scanning, and signed webhooks"
repository = "https://github.com/payroof/payroof"
homepage = "https://github.com/payroof/payroof"
readme = "README.md"
keywords = ["crypto", "payments", "ethereum", "webhooks", "watch-only"]
categories = ["cryptography::cryptocurrencies", "web-programming::http-server"]
# The published crate holds only what it builds from (no apps, CI, tests or Docker).
include = ["src/**", "migrations/**", "config/*.toml", "README.md", "CHANGELOG.md", "LICENSE-*"]
version = "0.3.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
[dependencies]
anyhow = "=1.0.104"
altcha = "=1.0.0"
axum = "=0.8.9"
base64 = "=0.23.1"
chacha20poly1305 = "=0.11.0"
chrono = { version = "=0.4.45", features = ["serde"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "alloc"] }
getrandom = "=0.4.3"
hex = "=0.4.3"
hmac = "=0.13.0"
k256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "std"] }
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
num-bigint = "=0.5.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sha3 = "=0.12.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "=1.1.8"
tower = { version = "=0.5.3", features = ["util", "limit"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
url = "=2.5.8"
zeroize = { version = "=1.9.1", features = ["derive", "serde"] }

[dev-dependencies]
# Already in the tree through reqwest's gzip support; used to serve compressed test replies.
flate2 = "=1.1.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
