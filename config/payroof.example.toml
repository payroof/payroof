# A deployment watching the same networks, coins and tokens Payroof Wallet starts with.
# Payroof watches exactly what is listed here: nothing can be added at runtime.
# Review every RPC, confirmation depth and asset before use.
bind = "0.0.0.0:8080"
origin = "https://api.example.com"
# Other origins this server is served at, if any; recovery signatures may name them.
# origin_aliases = ["https://payroof.example.com"]
database = "sqlite:///data/payroof.sqlite"
development = false
# Only list CIDRs of reverse proxies you operate. Other forwarding headers are ignored.
trusted_proxies = []

# Ethereum
[[chains]]
id = "eip155:1"
name = "Ethereum"
rpc = "https://ethereum.publicnode.com"
confirmations = 12
# start_height = 0  # omitted: scanning starts at the chain's head when Payroof first runs
[[chains.assets]]
id = "eip155:1/slip44:60"
kind = "native"
symbol = "ETH"
decimals = 18
[[chains.assets]]
id = "eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
kind = "erc20"
symbol = "USDC"
decimals = 6
