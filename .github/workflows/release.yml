name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
env:
  CARGO_TERM_COLOR: always
  BIN: payroof
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches crate version
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, version
          PY
      - name: Verify CHANGELOG.md has this version
        run: grep -q "^## \\[${GITHUB_REF_NAME#v}\\]" CHANGELOG.md
      - run: rustup toolchain install  # the version and components in rust-toolchain.toml
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo publish --locked --dry-run
  build:
    needs: check
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-26 }
          - { target: x86_64-apple-darwin, os: macos-26 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install && rustup target add "$TARGET"
      - run: cargo build --locked --release --target "$TARGET"
      - name: Package
        run: |
          name="$BIN-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/$BIN" README.md LICENSE-APACHE LICENSE-MIT "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.BIN }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release from this version's CHANGELOG.md section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" '/^## /{p = index($0, v) > 0; next} p && !/^\[/' CHANGELOG.md > notes.md
          test -s notes.md
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
  crate:
    name: crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  image:
    name: Container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish ghcr.io/payroof/payroof
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/payroof/payroof"
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$version" -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"
